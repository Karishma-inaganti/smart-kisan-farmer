<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ t.title }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>👨‍💼 {{ t.login }}</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST"
          action="/officer-login?lang={{ lang }}">

        <label>{{ t.username }}</label>
        <input type="text" name="username" required>

        <label>{{ t.password }}</label>
        <input type="password" name="password" required>

        <button type="submit">
            {{ t.login_button }}
        </button>

    </form>

    <br>

    <a href="/?lang={{ lang }}">
        ← {{ t.back }}
    </a>

</div>

</body>
</html>
