<!DOCTYPE html>
<html lang="{{ lang }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ t.my_token }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🎫 {{ t.my_token }}</h1>

    <div class="dashboard-card">

        <h2>{{ t.token_number }}</h2>

        <div class="big-number">
            A-102
        </div>

        <p>{{ t.procurement_status }}:
            <strong>{{ t.pending }}</strong>
        </p>

    </div>

    <br>

    <a href="/farmer?lang={{ lang }}">
        ← {{ t.back }}
    </a>

</div>

</body>
</html>
